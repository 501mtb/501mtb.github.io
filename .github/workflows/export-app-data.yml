name: Export 501MTB app data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Classeur_501MTB_V2.xlsx"
      - "scripts/export_app_data.py"
      - ".github/workflows/export-app-data.yml"
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: pip install openpyxl
      - name: Export public app sheets
        run: python scripts/export_app_data.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app-data.json
          if git diff --cached --quiet; then
            echo "App data JSON is already current."
          else
            git commit -m "Update Android app data export"
            git push
          fi
